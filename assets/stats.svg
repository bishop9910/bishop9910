<svg xmlns="http://www.w3.org/2000/svg" width="404" height="250" viewBox="0 0 404 250" role="img" aria-label="GitHub stats">
  <title>GitHub stats</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="55%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="1.1">
      <stop offset="0%" stop-color="#ff79c6" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#bd93f9" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.03"/>
    </pattern>
    <style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace; font-size: 12.5px; }
  /* Content stays visible by default; the animations only build up from a
     hidden start frame, so a renderer that ignores CSS still shows the text. */
  .t { animation: type .55s steps(32, end) both; }
  .f { animation: fade .5s ease-out both; }
  .b { animation: blink 1.1s steps(1) infinite; }
  @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .t, .f, .b { animation: none !important; } }
</style>
  </defs>
  <rect x="0.5" y="0.5" width="403" height="249" rx="10" fill="#12121b" stroke="#2b2b3d"/>
  <path d="M0.5 30 H403.5" stroke="#20202e"/>
  <circle cx="18" cy="15" r="4.5" fill="#ff5555" opacity="0.8"/><circle cx="34" cy="15" r="4.5" fill="#f1fa8c" opacity="0.8"/><circle cx="50" cy="15" r="4.5" fill="#50fa7b" opacity="0.8"/><text x="202" y="19" text-anchor="middle" fill="#5b6274" font-size="10.5">bishop9910@github — stats</text>
  <g class="t" style="animation-delay:0.10s"><text x="22.0" y="54" fill="#bd93f9">~$ </text><text x="44.5" y="54" fill="#d7dcea">gh stats</text></g><g class="f" style="animation-delay:0.30s"><text x="37" y="84" fill="#7d8698">total stars</text><text x="127.5" y="84" fill="#20202e" letter-spacing="1.2">···························</text><text x="382" y="84" text-anchor="end" fill="#ff79c6" font-weight="600">21</text></g><g class="f" style="animation-delay:0.42s"><text x="37" y="109" fill="#7d8698">public repos</text><text x="135.0" y="109" fill="#20202e" letter-spacing="1.2">··························</text><text x="382" y="109" text-anchor="end" fill="#ff79c6" font-weight="600">17</text></g><g class="f" style="animation-delay:0.54s"><text x="37" y="134" fill="#7d8698">commits / year</text><text x="150.0" y="134" fill="#20202e" letter-spacing="1.2">························</text><text x="382" y="134" text-anchor="end" fill="#ff79c6" font-weight="600">412</text></g><g class="f" style="animation-delay:0.66s"><text x="37" y="159" fill="#7d8698">contributions</text><text x="142.5" y="159" fill="#20202e" letter-spacing="1.2">·························</text><text x="382" y="159" text-anchor="end" fill="#ff79c6" font-weight="600">486</text></g><g class="f" style="animation-delay:0.78s"><text x="37" y="184" fill="#7d8698">pull requests</text><text x="142.5" y="184" fill="#20202e" letter-spacing="1.2">·························</text><text x="382" y="184" text-anchor="end" fill="#ff79c6" font-weight="600">23</text></g><g class="f" style="animation-delay:0.90s"><text x="37" y="209" fill="#7d8698">followers</text><text x="112.5" y="209" fill="#20202e" letter-spacing="1.2">·····························</text><text x="382" y="209" text-anchor="end" fill="#ff79c6" font-weight="600">6</text></g><text x="22" y="234" fill="#5b6274" font-size="10.5"># updated 2026-11-13 · sample</text>
</svg>
